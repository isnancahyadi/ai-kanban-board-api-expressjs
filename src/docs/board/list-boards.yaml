openapi: 3.0.0
info:
  title: Endpoint List Boards
  version: 1.0.0
paths:
  /boards:
    get:
      summary: List all boards for the authenticated user
      tags: [Board]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of boards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas.yaml#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '../schemas.yaml#/components/schemas/Board'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
    post:
      summary: Create a new board
      tags: [Board]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                color:
                  type: string
      responses:
        '201':
          description: Board created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas.yaml#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas.yaml#/components/schemas/Board'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
