openapi: 3.0.0
info:
  title: Endpoint Detail Board
  version: 1.0.0
paths:
  /boards/{boardId}:
    get:
      summary: Get a board by ID
      tags: [Board]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: boardId
          required: true
          schema:
            type: string
          description: The board ID
      responses:
        '200':
          description: Board details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas.yaml#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas.yaml#/components/schemas/Board'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (No access to this board)
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Board not found
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
    patch:
      summary: Update a board
      tags: [Board]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: boardId
          required: true
          schema:
            type: string
          description: The board ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: Board updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas.yaml#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas.yaml#/components/schemas/Board'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Board not found
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
