openapi: 3.1.0
info:
  title: Components Fragment Schemas
  version: 1.0.0
paths: {}

components:
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: "null"
    AddMemberSuccessResponse:
      description: Member added successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      member:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          name:
                            type: string
                          avatar_url:
                            type: string
                          role:
                            type: string
                            enum:
                              - admin
                              - member
    BoardCreateSuccessResponse:
      description: Board created successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      boards:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                            description:
                              oneOf:
                                - type: string
                                - type: "null"
                            color:
                              oneOf:
                                - type: string
                                - type: "null"
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            owner_id:
                              type: string
                              format: uuid
    BoardUpdateSuccessResponse:
      description: Board updated successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      boards:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                            description:
                              oneOf:
                                - type: string
                                - type: "null"
                            color:
                              oneOf:
                                - type: string
                                - type: "null"
                            created_at:
                              type: string
                              format: date-time
                            updated_at:
                              type: string
                              format: date-time
                            owner_id:
                              type: string
                              format: uuid
    UserLoginSuccessResponse:
      description: User login successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type: string
                            format: email
                          avatar_url:
                            oneOf:
                              - type: string
                              - type: "null"
                          created_at:
                            type: string
                            format: date-time
                      token:
                        type: string
    UserRegisterSuccessResponse:
      description: User registered successfully
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Success'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          email:
                            type: string
                            format: email
                          avatar_url:
                            oneOf:
                              - type: string
                              - type: "null"
                          created_at:
                            type: string
                            format: date-time
                      token:
                        type: string
    ValidationErrorResponse:
      description: Validation Error Response
      content:
        application/json:
          schema:
            allOf:
              - $ref: './schemas.yaml#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
