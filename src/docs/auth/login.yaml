openapi: 3.1.0
info:
  title: Endpoint Login
  version: 1.0.0
paths:
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User login successfully
          $ref: "../responses.yaml#/components/responses/UserLoginSuccessResponse"
        '400':
          description: Login bad request
          $ref: '../responses.yaml#/components/responses/ErrorResponse'
        '422':
          description: Login validation error
          $ref: '../responses.yaml#/components/responses/ValidationErrorResponse'
        '500':
          description: Internal server error
          $ref: '../responses.yaml#/components/responses/ErrorResponse'
