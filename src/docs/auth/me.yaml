openapi: 3.0.0
info:
  title: Endpoint Login
  version: 1.0.0
paths:
  /auth/me:
    get:
      summary: Get current authenticated user
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returns user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../schemas.yaml#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '../schemas.yaml#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '../schemas.yaml#/components/schemas/ErrorResponse'
