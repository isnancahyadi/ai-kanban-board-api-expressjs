openapi: 3.1.0
info:
  title: Endpoint Register
  version: 1.0.0
paths:
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas.yaml#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          $ref: "../responses.yaml#/components/responses/UserRegisterSuccessResponse"
        '409':
          description: Data conflict
          $ref: '../responses.yaml#/components/responses/ErrorResponse'
        '422':
          description: Register validation error
          $ref: '../responses.yaml#/components/responses/ValidationErrorResponse'
        '500':
          description: Internal server error
          $ref: '../responses.yaml#/components/responses/ErrorResponse'
